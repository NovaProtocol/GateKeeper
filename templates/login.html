<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access Required</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); width: 100%; max-width: 400px; }
  h1 { margin-bottom: .5rem; font-size: 1.25rem; }
  p { color: #666; margin-bottom: 1rem; }
  input[type=text] { width: 100%; padding: .5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 1rem; }
  button { width: 100%; padding: .5rem; font-size: 1rem; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #555; }
  .error { color: #d00; margin-bottom: 1rem; }
</style>
</head>
<body>
<div class="card">
  <h1>Access Required</h1>
  <p>Enter your access code to continue.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="text" name="code" placeholder="Access code" autofocus>
    <button type="submit">Submit</button>
  </form>
</div>
</body>
</html>
