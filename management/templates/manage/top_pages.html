{% extends "base.html" %}
{% block title %}Top Pages · GateKeeper{% endblock %}
{% block content %}
<div class="container">
  <div class="card">
    <div class="card-header"><h2><i class="fa-solid fa-chart-simple"></i> Top Pages</h2></div>
    <div class="card-body" style="padding:0">
      <div class="table-scroll" tabindex="0" role="region" aria-label="Top pages">
      <table class="codes-table">
        <thead><tr><th>Host / Path</th><th style="width:45%">Traffic</th><th>Calls</th></tr></thead>
        <tbody>
        {% for p in pages %}
        <tr>
          <td style="font-family:'JetBrains Mono',monospace;font-size:.8rem">{{ p.host }}{{ p.path }}</td>
          <td>
            <div class="bar-row">
              <span class="bar-track"><span class="bar-fill" style="width:{{ p.percent }}%"></span></span>
              <span style="font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--accent);min-width:36px">{{ p.percent }}%</span>
            </div>
          </td>
          <td style="font-family:'JetBrains Mono',monospace">{{ p.calls }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3" style="text-align:center;color:var(--text-secondary);padding:1.5rem">No data</td></tr>
        {% endfor %}
        </tbody>
      </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
