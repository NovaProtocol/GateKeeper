{% extends "base.html" %}
{% block title %}Settings · GateKeeper{% endblock %}
{% block content %}
<div class="container" style="padding:2rem;max-width:1100px">
  <div class="card">
    <div class="card-header"><h2><i class="fa-solid fa-gear"></i> Settings</h2></div>
    <div class="card-body" style="color:var(--text-secondary);font-size:.9rem">
      <p>System settings are managed via environment variables (<span style="font-family:'JetBrains Mono',monospace;color:var(--text-primary)">SECRET_KEY</span>, <span style="font-family:'JetBrains Mono',monospace;color:var(--text-primary)">MANAGE_PASSWORD</span>, <span style="font-family:'JetBrains Mono',monospace;color:var(--text-primary)">INTERNAL_API_KEY</span>).</p>
      <p style="margin-top:.75rem">Use <span style="font-family:'JetBrains Mono',monospace;color:var(--accent)">/manage/backup</span> to export DB snapshots.</p>
    </div>
  </div>
</div>
{% endblock %}
