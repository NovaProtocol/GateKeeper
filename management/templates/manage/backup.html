{% extends "base.html" %}
{% block title %}Backup · GateKeeper{% endblock %}
{% block content %}
<div class="container" style="padding:2rem;max-width:1100px">
  <div class="card">
    <div class="card-header"><h2><i class="fa-solid fa-floppy-disk"></i> Backup</h2></div>
    <div class="card-body" style="color:var(--text-secondary);font-size:.9rem">
      <p>Backup exports are available via the API: <span style="font-family:'JetBrains Mono',monospace;color:var(--accent)">GET /api/logs/export?format=csv</span> and DB volume snapshots.</p>
      <a href="/manage/settings" class="btn" style="margin-top:.75rem;background:var(--bg-primary);border:1px solid var(--border);color:var(--text-primary)" title="Back to Settings" aria-label="Back to Settings"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
    </div>
  </div>
</div>
{% endblock %}
