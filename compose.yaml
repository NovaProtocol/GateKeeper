name: gatekeeper

services:
  caddy:
    build: ./caddy
    container_name: gatekeeper_caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:7000"
    networks:
      default:
      gatekeeper:
        aliases:
          - gatekeeper
      cloudflared-tunnel:
        aliases:
          - gatekeeper
    depends_on:
      auth-gateway:
        condition: service_healthy

  auth-gateway:
    build:
      context: .
      dockerfile: auth-gateway/Dockerfile
    container_name: gatekeeper_auth
    restart: unless-stopped
    expose:
      - "8001"
    # Docker inherits the host's search domains, and the host's resolver is
    # systemd-resolved with Tailscale MagicDNS in front of it. That combination
    # leaves `ndots:0` (inherited from the host's resolv.conf), which makes glibc
    # treat a bare name as **absolute and try it first**.
    #
    # `main-server` is not a public name. The absolute query `main-server.` goes
    # out, sits until the resolver's timeout, and comes back NXDOMAIN — then glibc
    # tries the search domain and answers instantly. Measured: 3.9-4.0s per
    # lookup, every time, on every route proxied to another machine.
    #
    # `ndots:1` puts the search domain first, so the name that actually exists is
    # the name that is asked for. Verified on this host: 4.0s -> 0.000s, with
    # Docker-internal names still resolving immediately (they are answered by
    # Docker's own resolver before the search list is consulted).
    #
    # It only shows on a *new* connection: httpx pools sockets, so only the first
    # request after the pool empties carries the lookup. That is why the symptom
    # was one slow page load and then a fast one.
    dns_opt:
      - ndots:1
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      MANAGE_PASSWORD: ${MANAGE_PASSWORD:?MANAGE_PASSWORD is required}
      BACKUP_CODE: ${BACKUP_CODE:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
      API_HTTP_ADDR: "http://api:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - net-api
      - gatekeeper
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: gatekeeper_api
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      MANAGE_PASSWORD: ${MANAGE_PASSWORD:?MANAGE_PASSWORD is required}
      BACKUP_CODE: ${BACKUP_CODE:-}
      DB_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
    volumes:
      - gatekeeper_data:/data
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - net-api
      - net-data
      - gatekeeper

  management:
    build:
      context: .
      dockerfile: management/Dockerfile
    container_name: gatekeeper_management
    restart: unless-stopped
    expose:
      - "8003"
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      MANAGE_PASSWORD: ${MANAGE_PASSWORD:?MANAGE_PASSWORD is required}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:?DEPLOYMENT_TYPE is required}
      API_HTTP_ADDR: "http://api:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - net-api
    depends_on:
      api:
        condition: service_healthy

  mysql-db:
    image: mysql:8.4
    container_name: gatekeeper_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASS:-gatekeeperpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gatekeeper}
    volumes:
      - mysql_data:/var/lib/mysql
    command: --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - net-data

  documentation:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    container_name: gatekeeper_documentation
    restart: unless-stopped
    expose:
      - "8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default

volumes:
  gatekeeper_data:
  mysql_data:

networks:
  default:
  net-api:
    internal: true
  net-data:
    internal: true
  gatekeeper:
    name: gatekeeper
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default
