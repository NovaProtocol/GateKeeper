services:
  gatekeeper:
    build: .
    ports:
      - "7000:7000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MANAGE_PASSWORD=${MANAGE_PASSWORD}
      - BACKUP_CODE=${BACKUP_CODE:-}
      - DB_DIR=/data
    networks:
      - default
      - cloudflared-tunnel
    volumes:
      - gatekeeper_data:/data
    restart: unless-stopped

volumes:
  gatekeeper_data:

networks:
  default:
  cloudflared-tunnel:
    external: true
    name: cloudflared-tunnel_default
